openapi: 3.0.0
info:
  title: Library Catalog
  version: '1.0'
  description: >-
    Read-only lookup over the library portal's catalog. Answers from the same
    records the portal's pages render, so a workflow can look an item up through
    the API and verify it on screen without the two disagreeing.
servers:
  - url: http://localhost:3020
paths:
  /api/catalog/{isbn}:
    get:
      operationId: getCatalogItem
      summary: Look up one catalog item by ISBN
      parameters:
        - name: isbn
          in: path
          required: true
          description: The item's ISBN, exactly as the catalog records it.
          schema:
            type: string
      responses:
        '200':
          description: The item.
          content:
            application/json:
              schema:
                type: object
                properties:
                  isbn: { type: string }
                  title: { type: string }
                  author: { type: string }
                  category: { type: string }
                  status:
                    type: string
                    description: available, on_loan, or on_hold.
                  dueDate:
                    type: string
                    nullable: true
        '404':
          description: No item with that ISBN.
